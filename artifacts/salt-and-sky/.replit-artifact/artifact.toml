kind = "web"
previewPath = "/"
title = "Salt & Sky — Julian CA"
version = "1.0.0"
id = "artifacts/salt-and-sky"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23443

[services.development]
run = "pnpm --filter @workspace/salt-and-sky run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salt-and-sky", "run", "build" ]
publicDir = "artifacts/salt-and-sky/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23443"
BASE_PATH = "/"
